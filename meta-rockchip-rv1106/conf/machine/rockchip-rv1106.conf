require conf/machine/include/arm/armv7a/tune-cortexa7.inc

PREFERRED_PROVIDER_u-boot ?= "u-boot-rockchip-rv1106"
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-rockchip-rv1106"
UBOOT_MACHINE = "rv1106_defconfig"
UBOOT_SUFFIX = "img"
UBOOT_ENTRYPOINT ?= "0x00008000"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-rockchip"
PREFERRED_PROVIDER_virtual/dtb = "devicetree-rockchip-rv1106"

INITRAMFS_IMAGE = "platform-test-image"

MACHINE_FEATURES:remove = "\
    rtc \
"

SERIAL_CONSOLES = "115200;ttyFIQ0"
USE_VT = "0"
