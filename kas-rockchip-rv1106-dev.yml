header:
  version: 15

machine: rockchip-rv1106
distro: poky
target:
  - sdcard

repos:
  poky:
    url: https://github.com/yoctoproject/poky
    path: layers/poky
    commit: 1e8099846661571ede077f533eb1b6c86818ddce
    layers:
      meta:
      meta-poky:

  meta-ptx:
    url: https://git.pengutronix.de/git/meta-ptx
    path: layers/meta-ptx
    commit: 1189ee566604d7439e824242825da29ae3729ae5

  rockchip-rv1106:
    layers:
      meta-rockchip-rv1106:

local_conf_header:
  custom_dirs: |
    DEPLOY_DIR = "${TOPDIR}/deploy"
    DL_DIR = "${TOPDIR}/../downloads"
    SSTATE_DIR = "${TOPDIR}/../sstate-cache"
  standard: |
    CONF_VERSION = "2"
    SDKMACHINE = "x86_64"
    PATCHRESOLVE = "noop"
  reduce_diskspace: |
    INHERIT += "rm_work"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  disk-monitor: |
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
