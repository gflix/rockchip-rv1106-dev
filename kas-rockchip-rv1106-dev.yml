header:
  version: 15

machine: rockchip-rv1106
distro: poky
target:
  - sdcard

repos:
  bitbake:
    url: https://github.com/openembedded/bitbake
    path: layers/bitbake
    commit: 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
    layers: {}

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core
    path: layers/openembedded-core
    commit: 8751ec83421192fc0f8495fb95798f9eb7be77a0
    layers:
      meta:

  yocto:
    url: https://git.yoctoproject.org/meta-yocto
    path: layers/meta-yocto
    commit: 3f2e6b6fadfa542f0fe3738375a2f9fcbd4c1f6e
    layers:
      meta-poky:

  rockchip-rv1106:
    layers:
      meta-rockchip-rv1106:

local_conf_header:
  custom_dirs: |
    DEPLOY_DIR = "${TOPDIR}/deploy"
    DL_DIR = "${TOPDIR}/../downloads"
    SSTATE_DIR = "${TOPDIR}/../sstate-cache"
  standard: |
    CONF_VERSION = "2"
    SDKMACHINE = "x86_64"
    PATCHRESOLVE = "noop"
  reduce_diskspace: |
    INHERIT += "rm_work"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "allow-empty-password empty-root-password allow-root-login"
  disk-monitor: |
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
