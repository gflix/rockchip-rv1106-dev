header:
  version: 15

machine: rockchip-rv1106
distro: poky
target:
  - sdcard

repos:
  poky:
    url: https://github.com/yoctoproject/poky
    path: layers/poky
    commit: 70dc28ac287bf35541270cae1d99130a0f6b7b5f
    layers:
      meta:
      meta-poky:

  openembedded:
    url: https://github.com/openembedded/meta-openembedded
    path: layers/meta-openembedded
    commit: c93994f1bb601c57548b588d4f77a044d90822cf
    layers:
      meta-oe:

  meta-ptx:
    url: https://git.pengutronix.de/git/meta-ptx
    path: layers/meta-ptx
    commit: 59a6fbbaf56526c91ca0926c6833b32489e8536c

  rockchip-rv1106:
    layers:
      meta-rockchip-rv1106:

local_conf_header:
  custom_dirs: |
    DEPLOY_DIR = "${TOPDIR}/deploy"
    DL_DIR = "${TOPDIR}/../downloads"
    SSTATE_DIR = "${TOPDIR}/../sstate-cache"
  standard: |
    CONF_VERSION = "2"
    SDKMACHINE = "x86_64"
    PATCHRESOLVE = "noop"
  reduce_diskspace: |
    INHERIT += "rm_work"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "allow-empty-password empty-root-password allow-root-login"
  disk-monitor: |
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
