header:
  version: 15

machine: rockchip-rv1106
distro: platform-test
target:
  - sdcard

repos:
  bitbake:
    url: https://github.com/openembedded/bitbake
    path: layers/bitbake
    commit: 33581c84f3a85008239acbd940501a35de48dc91
    layers: {}

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core
    path: layers/openembedded-core
    commit: 42fa856a00ac16b2a7a83d7ecfa60a5be192b16c
    layers:
      meta:

  yocto:
    url: https://git.yoctoproject.org/meta-yocto
    path: layers/meta-yocto
    commit: 904846ae078ee20de073040ebb77c86e19250f56
    layers:
      meta-poky:

  rockchip-rv1106:
    layers:
      meta-rockchip-rv1106:

local_conf_header:
  custom_dirs: |
    DEPLOY_DIR = "${TOPDIR}/deploy"
    DL_DIR = "${TOPDIR}/../downloads"
    SSTATE_DIR = "${TOPDIR}/../sstate-cache"
  standard: |
    CONF_VERSION = "2"
    SDKMACHINE = "x86_64"
    PATCHRESOLVE = "noop"
  reduce_diskspace: |
    INHERIT += "rm_work"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "allow-empty-password empty-root-password allow-root-login"
  disk-monitor: |
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
